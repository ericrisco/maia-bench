name: Pàgina de resultats

on:
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publica:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.desplega.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - run: rm -f web/plantilla.html web/textos.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: desplega
        uses: actions/deploy-pages@v4
